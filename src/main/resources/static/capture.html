<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java-Dex Real Photos</title>
    <link rel="stylesheet" href="capture.css">
</head>
<body>
<header>
    <h1>Java-Dex Real Photos (optional)</h1>
    <p>Training works without these. To add the photos taken here to the drawn pictures, start the app with <code>app.train.use-captures=true</code>. <a href="/" style="color:#f7b32b">Back to detection</a></p>
</header>

<main>
    <section class="camera">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" hidden></canvas>
        <div class="controls">
            <button id="captureBtn" disabled>Capture for selected card</button>
            <span id="status">Starting camera…</span>
        </div>
    </section>

    <section class="cards">
        <h2>Pick the card you are holding up</h2>
        <div id="cardGrid" class="grid"></div>
    </section>
</main>

<script src="capture.js"></script>
</body>
</html>
