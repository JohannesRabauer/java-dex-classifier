spring.application.name=demo-catch

app.data-dir=data
app.cards-dir=cards

spring.datasource.url=jdbc:h2:file:./data/jobrunr-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

jobrunr.database.skip-create=false
jobrunr.dashboard.enabled=true
jobrunr.background-job-server.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

spring.web.resources.static-locations=classpath:/static/,file:cards/

# training: no photos needed, the cards are drawn into fake webcam pictures
app.synthetic.per-card=100
app.synthetic.valid-per-card=25
app.train.epochs=60
# true: photos from the capture page (data/captures) are added to the drawn pictures
app.train.use-captures=false
# below this confidence the page says "not sure" instead of naming a card
app.unsure-below=0.8
